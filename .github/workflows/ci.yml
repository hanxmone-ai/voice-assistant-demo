name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Smoke test the built server
        run: |
          STATIC_DIR=build/web PORT=8788 node build/server/server/index.js &
          for i in $(seq 1 30); do curl -sf localhost:8788/api/health && break; sleep 0.5; done
          curl -sf localhost:8788/api/health | grep -q '"stt":false'
          curl -sf localhost:8788/ | grep -q '<title>Voice Assistant Demo</title>'
          curl -sfN -X POST localhost:8788/api/chat -H 'content-type: application/json' \
            -d '{"messages":[{"role":"user","content":"hello"}]}' | grep -q 'event: done'
          # Speech is the browser's job without a model API.
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8788/api/transcribe -H 'content-type: audio/wav' --data-binary 'x')" = 404

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t voice-assistant-demo .
      - name: Run the image
        run: |
          docker run -d -p 8788:8788 --name voice voice-assistant-demo
          for i in $(seq 1 30); do curl -sf localhost:8788/api/health && break; sleep 1; done
          curl -sfN -X POST localhost:8788/api/chat -H 'content-type: application/json' \
            -d '{"messages":[{"role":"user","content":"hello"}]}' | grep -q 'event: done'
